[project]
name = "nbe-ai-service"
version = "0.1.0"
description = "Internal FastAPI AI service for the NBE AI-PFM platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "aioboto3>=15.5.0",
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1",
    "tiktoken>=0.13",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "openinference-instrumentation-langchain>=0.1.67",
    "saq[postgres]>=0.26.4",
    # HTTP client for optional hosted NLI shadow comparison (scope_guard.py).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
]
# Code-generation only — pinned EXACT for deterministic backend-mirror output.
# Kept out of default-groups so runtime and CI never install it; activate with
# `uv run --group codegen ...` when regenerating app/backend_db/models.py.
# psycopg is the SYNC driver sqlacodegen needs (runtime stays asyncpg-only).
codegen = [
    "sqlacodegen==4.0.4",
    "psycopg[binary]==3.3.4",
]
# Local NLI shadow model (app/features/chat/scope_guard.py) — mDeBERTa-v3-base-mnli-xnli
# run in-process, for AI_SERVICE_NLI_SHADOW__MODE=local. Kept out of default-groups, same
# reasoning as codegen above: a plain `uv sync` (CI, and any deployment running in "hosted"
# mode) never pulls in ~200MB of CPU-only torch it won't use. Activate with
# `uv sync --group local-scope-guard` before switching the mode flag to "local".
local-scope-guard = [
    "transformers>=4.46",
    "torch>=2.5",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# A bare `pytest` (no path argument) only collects the production test
# suite — the red-team suite (redteam/) is never collected implicitly.
# `pytest redteam` / `make redteam` still work by passing an explicit path,
# which overrides testpaths. See redteam/README.md.
testpaths = ["tests"]
